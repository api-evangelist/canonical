gaps:
- Only snapd enumerates its machine-readable error kinds. LXD, AMS and the Landscape Debarchive API return
  a free-text `error` string with no sub-code enum, so a client cannot branch exhaustively from those
  contracts alone.
- No application/problem+json (RFC 9457) anywhere in the corpus — all 334 typed error responses are application/json
  carrying a product-specific envelope.
- 'No published cross-product error-code registry: each Canonical product documents its own failures and
  there is no shared catalog.'
