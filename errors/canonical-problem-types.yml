envelopes:
- api: LXD REST API
  shape:
    type: error
    error: string, human-readable message
    error_code: integer, mirrors the HTTP status
  note: Every LXD response — success or failure — is wrapped in the same envelope with a `type` discriminator
    of sync, async or error. An async response carries an `operation` URL under /1.0/operations/{id}.
- api: snapd REST API
  shape:
    type: error
    status-code: integer
    status: string
    result: '{message, kind, value}'
  note: snapd nests the failure under result with a machine-readable `kind` that a client should branch
    on. The kinds are ENUMERATED in the published contract (ConflictError, SnapNotInstalledError, ConfdbError,
    NoModelAssertionError, NoSerialAssertionError), which is the strongest machine-readable error typing
    anywhere in the Canonical corpus.
  error_kinds:
  - snap-change-conflict
  - snap-not-found
  - snap-not-installed
  - assertion-not-found
  - option-not-available
  - option-not-found
- api: Hardware API / Test Observer / Testflinger
  shape:
    detail: array of {loc, msg, type}
  note: FastAPI-standard 422 validation envelope.
- api: Anbox Cloud AMS
  shape:
    type: error
    error: string
    error_code: integer
    metadata: object
  note: Same LXD-derived envelope; AMS is built on the LXD codebase.
