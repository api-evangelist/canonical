description: Canonical is the company behind Ubuntu, the world's most popular open source operating system for cloud, servers, desktops, IoT,
  and Kubernetes. Canonical publishes a broad set of developer APIs spanning the Ubuntu and Canonical ecosystem — the Snap Store and Snapcraft,
  the Charmhub charm marketplace, LXD system containers, MAAS bare-metal provisioning, Juju orchestration, Launchpad project hosting, Ubuntu Pro
  subscription services, and Landscape systems management — most of which are RESTful, open, and well documented.
