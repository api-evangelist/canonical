- aid: canonical:ubuntu-pro-api
  name: Ubuntu Pro Client API
  description: >-
    The Ubuntu Pro client exposes a local API/CLI for managing Ubuntu Pro subscription services on a host
    — enabling, disabling, and inspecting Extended Security Maintenance (ESM), Livepatch, FIPS, compliance
    tooling (CIS, DISA-STIG), USG, and Landscape integration.
  humanURL: https://documentation.ubuntu.com/pro/
  tags:
  - ESM
