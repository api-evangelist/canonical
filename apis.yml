    url: https://canonical.com/lxd
- aid: canonical:ubuntu-security-api
  name: Ubuntu Security API
  description: >-
    An open, unauthenticated API over Canonical's vulnerability data — Ubuntu Security Notices (USNs),
    CVE records with CVSS3 scoring, and per-release support status. Canonical publishes a Swagger 2.0
    contract for it at https://ubuntu.com/security/api/spec.json and a Swagger UI at
    /security/api/docs. It is the most agent-friendly surface Canonical operates: read-only, needs no
    credential, and answers the question "is my Ubuntu package affected by this CVE?" directly.
  humanURL: https://ubuntu.com/security/api/docs
  baseURL: https://ubuntu.com
  tags:
  - Security
  - CVE
  - Vulnerability
