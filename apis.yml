- aid: canonical:maas-api
  name: MAAS API
  description: >-
    The RESTful API for MAAS (Metal as a Service). Everything the MAAS UI can do — commissioning, allocation,
    deployment, DHCP/DNS, tags, zones, pools, users, machines — is available through the API, making bare-
    metal infrastructure programmable and suitable for Infrastructure as Code workflows. Python and CLI
    bindings are provided.
  humanURL: https://canonical.com/maas/docs/api
  baseURL: https://<maas-host>/MAAS/api/2.0
