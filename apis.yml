apis:
- aid: canonical:snap-store-api
  name: Snap Store API
  description: >-
    The public Snap Store Device API (api.snapcraft.io) serves information about snaps, revisions, channels,
    tracks, assertions, and refresh state to snap clients. The Snapcraft Dashboard API (dashboard.snapcraft.io)
    lets snap publishers manage releases, brand stores, and snap metadata programmatically.
  humanURL: https://api.snapcraft.io/docs/
  baseURL: https://api.snapcraft.io
  tags:
  - Snaps
  - Store
  - Packaging
  properties:
  - type: Documentation
    url: https://api.snapcraft.io/docs/
  - type: DashboardAPI
    url: https://dashboard.snapcraft.io/docs/reference/v2/en/index.html
  - type: HowTo
    url: https://snapcraft.io/docs/using-the-api
- aid: canonical:charmhub-api
  name: Charmhub API
  description: >-
    Developer-facing REST API for Charmhub, Canonical's marketplace for charms (Kubernetes and machine
    operators). Supports charm discovery, publishing, release channels, and token exchange — macaroons
    issued by dashboard.snapcraft.io SSO are exchanged for Charmhub developer tokens used in the Authorization
    header.
  humanURL: https://api.charmhub.io/docs/default.html
  baseURL: https://api.charmhub.io
  tags:
  - Charms
  - Operator
  - Kubernetes
  tags_raw:
  - Charms
  - Operators
  - Kubernetes
  properties:
  - type: Documentation
    url: https://api.charmhub.io/docs/default.html
  - type: Portal
    url: https://charmhub.io/
- aid: canonical:maas-api
  name: MAAS API
  description: >-
    The RESTful API for MAAS (Metal as a Service). Everything the MAAS UI can do — commissioning, allocation,
    deployment, DHCP/DNS, tags, zones, pools, users, machines — is available through the API, making bare-
    metal infrastructure programmable and suitable for Infrastructure as Code workflows. Python and CLI
    bindings are provided.
  humanURL: https://canonical.com/maas/docs/api
  baseURL: https://<maas-host>/MAAS/api/2.0
  tags:
  - Bare Metal
  - Provisioning
  - Infrastructure
  properties:
  - type: Documentation
    url: https://canonical.com/maas/docs/api
  - type: Overview
    url: https://canonical.com/maas
  - type: Portal
    url: https://maas.io/docs
- aid: canonical:juju-api
  name: Juju Client / Controller API
  description: >-
    Juju is Canonical's open-source orchestration engine for deploying, integrating, scaling, and managing
    applications on clouds, MAAS, LXD, and Kubernetes via charms. Juju clients communicate with a controller
    over a websocket-based API; Python and Go libraries plus the juju CLI consume this API.
  humanURL: https://documentation.ubuntu.com/juju/
  tags:
  - Orchestration
  - DevOps
  - Charms
  properties:
  - type: Documentation
    url: https://documentation.ubuntu.com/juju/
  - type: Overview
    url: https://canonical.com/juju
  - type: Architecture
    url: https://canonical.com/juju/juju-architecture
- aid: canonical:launchpad-api
  name: Launchpad Web Services API
  description: >-
    Launchpad exposes a RESTful Web Services API over its project hosting, bug tracking, code, builds,
    translations, and distribution data. The API is authenticated with OAuth; anonymous access gives read-only
    access to public data. The launchpadlib Python library is the officially supported client.
  humanURL: https://documentation.ubuntu.com/launchpad/user/how-to/launchpad-api/
  baseURL: https://api.launchpad.net/
  tags:
  - Authentication
  - Open Source
  - Project Hosting
  tags_raw:
  - OAuth
