- aid: canonical:lxd-rest-api
  name: LXD REST API
  description: >-
    The REST API used by every LXD client. LXD is Canonical's system container and virtual machine
    manager; the API is available over a local unix+http socket and over remote https, authenticated
    by TLS client certificate, OIDC identity, or unix group membership for local users. Canonical
    publishes the full contract as a Swagger 2.0 document with 169 paths, 333 operations and 236
    schema definitions — the largest and most complete API contract in the Canonical portfolio.
    Capability discovery is through the api_extensions[] array on GET /1.0 rather than a path version
    bump; the path has been /1.0 since 2016.
  humanURL: https://documentation.ubuntu.com/lxd/latest/rest-api/
  baseURL: https://<lxd-host>:8443
  tags:
  - Containers
  - Virtualization
  - Infrastructure
  properties:
  - type: OpenAPI
    url: openapi/canonical-lxd-rest-api-openapi.yml
  - type: Overlay
    url: overlays/canonical-lxd-rest-api-overlay.yaml
