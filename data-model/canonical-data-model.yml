cross_cutting:
- 'Async-by-default: LXD Operation and snapd Change are the same pattern — a write returns a handle, and
  the client polls or waits on that handle rather than blocking.'
- 'Project/tenant scoping: every LXD collection is filtered by the ?project= query parameter; omitting
  it silently scopes to the "default" project.'
- 'Recursion instead of expansion: LXD uses ?recursion=1 (and 2) to inline child objects rather than a
  sparse-fieldset or include[] parameter.'
