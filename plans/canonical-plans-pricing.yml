description: >-
  Canonical publishes list pricing openly — unusual for an infrastructure vendor at this scale — but
  none of it is API pricing. Every Canonical API in this repo (Snap Store Device API, Charmhub API,
  snapd, LXD, Launchpad, Ubuntu Security API, Testflinger, Hardware API) is FREE AND UNMETERED, with
  no plan, no key tier and no quota attached to the API itself. What is priced is the Ubuntu Pro
  subscription and its support and management add-ons, charged per machine per year, and the
  Landscape SaaS that fronts the Landscape API. The tiers below are transcribed verbatim from the
  published pricing page on 2026-09-05.
  NOTE: this file replaces a 2026-05-04 bulk-sweep scaffold whose Free/Professional tiers, request
  quotas and per-minute rate limits were placeholder values Canonical never published.
api_pricing:
  metered_apis: false
  note: >-
    No Canonical API charges per call, per key or per quota. The Snap Store Device API, Charmhub API
    and Ubuntu Security API are open and unauthenticated or macaroon-authenticated at no cost; LXD,
    snapd and Pebble are open-source software the consumer runs themselves; Launchpad is free for
    open-source projects.
