          x-go-name: APIVersion
        auth:
          description: Whether the client is trusted (one of "trusted" or "untrusted")
          example: untrusted
          readOnly: true
          type: string
          x-go-name: Auth
        auth_methods:
          description: 'List of supported authentication methods


