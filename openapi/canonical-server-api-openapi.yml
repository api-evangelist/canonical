          readOnly: true
          type: string
          x-go-name: AuthUserName
        client_certificate:
          description: 'Whether the requester sent a client certificate with the request


            API extension: client_cert_presence'
          example: false
          readOnly: true
          type: boolean
          x-go-name: ClientCertificate
        config:
          additionalProperties: {}
