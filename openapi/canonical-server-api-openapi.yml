openapi: 3.2.0
info:
  contact:
    email: lxd@lists.canonical.com
    name: LXD upstream
    url: https://github.com/canonical/lxd
  description: 'This is the REST API used by all LXD clients.

    Internal endpoints aren''t included in this documentation.


    The LXD API is available over both a local unix+http and remote https API.

    Authentication for local users relies on group membership and access to the unix socket.

    For remote users, the default authentication method is TLS client.'
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  title: LXD external REST Server API
  version: '1.0'
tags:
- name: Server
paths:
  /:
    get:
      description: 'Returns a list of supported API versions (URLs).


        Internal API endpoints are not reported as those aren''t versioned and

        should only be used by LXD itself.'
      operationId: api_get
      responses:
        '200':
          description: API endpoints
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    description: List of endpoints
                    example:
                    - /1.0
                    items:
                      type: string
                    type: array
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
      summary: Get the supported API endpoints
      tags:
      - Server
  /1.0:
    get:
      description: Shows the full server environment and configuration.
      operationId: server_get
      parameters:
      - description: Cluster member name
        example: lxd01
        in: query
        name: target
        schema:
          type: string
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '200':
          description: Server environment and configuration
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    $ref: '#/components/schemas/Server'
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get the server environment and configuration
      tags:
      - Server
    patch:
      description: Updates a subset of the server configuration.
      operationId: server_patch
      parameters:
      - description: Cluster member name
        example: lxd01
        in: query
        name: target
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/EmptySyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Partially update the server configuration
      tags:
      - Server
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerPut'
        description: Server configuration
        required: true
    put:
      description: Updates the entire server configuration.
      operationId: server_put
      parameters:
      - description: Cluster member name
        example: lxd01
        in: query
        name: target
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/EmptySyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update the server configuration
      tags:
      - Server
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerPut'
        description: Server configuration
        required: true
  /1.0/events:
    get:
      description: Connects to the event API using websocket.
      operationId: events_get
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      - description: Event type(s), comma separated (valid types are logging, operation, lifecycle, ovn or security)
        example: logging,lifecycle
        in: query
        name: type
        schema:
          type: string
      - description: Retrieve instances from all projects
        in: query
        name: all-projects
        schema:
          type: boolean
      responses:
        '200':
          description: Websocket message (JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get the event stream
      tags:
      - Server
  /1.0/resources:
    get:
      description: Gets the hardware information profile of the LXD server.
      operationId: resources_get
      parameters:
      - description: Cluster member name
        example: lxd01
        in: query
        name: target
        schema:
          type: string
      responses:
        '200':
          description: Hardware resources
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    $ref: '#/components/schemas/Resources'
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get system resources information
      tags:
      - Server
  /1.0?public:
    get:
      description: 'Shows a small subset of the server environment and configuration

        which is required by untrusted clients to reach a server.


        The `?public` part of the URL isn''t required, it''s simply used to

        separate the two behaviors of this endpoint.'
      operationId: server_get_untrusted
      responses:
        '200':
          description: Server environment and configuration
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    $ref: '#/components/schemas/ServerUntrusted'
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get the server environment
      tags:
      - Server
components:
  schemas:
    ResourcesGPUCardSRIOV:
      description: ResourcesGPUCardSRIOV represents the SRIOV configuration of the GPU
      properties:
        current_vfs:
          description: Number of VFs currently configured
          example: 0
          format: uint64
          type: integer
          x-go-name: CurrentVFs
        maximum_vfs:
          description: Maximum number of supported VFs
          example: 0
          format: uint64
          type: integer
          x-go-name: MaximumVFs
        vfs:
          description: List of VFs (as additional GPU devices)
          example: null
          items:
            $ref: '#/components/schemas/ResourcesGPUCard'
          type: array
          x-go-name: VFs
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    Event:
      description: Event represents an event entry (over websocket)
      properties:
        location:
          description: 'Originating cluster member


            API extension: event_location'
          example: lxd01
          type: string
          x-go-name: Location
        metadata:
          description: JSON encoded metadata (see EventLogging, EventLifecycle, Operation or EventSecurity)
          example: '{"action": "instance-started", "source": "/1.0/instances/c1", "context": {}}'
          x-go-name: Metadata
        project:
          description: 'Project the event belongs to.


            API extension: event_project'
          example: default
          type: string
          x-go-name: Project
        timestamp:
          description: Time at which the event was sent
          example: '2021-02-24T19:00:45.452649098-05:00'
          format: date-time
          type: string
          x-go-name: Timestamp
        type:
          description: Event type (one of operation, logging, lifecycle, ovn or security)
          example: lifecycle
          type: string
          x-go-name: Type
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesCPUCache:
      description: ResourcesCPUCache represents a CPU cache
      properties:
        level:
          description: Cache level (usually a number from 1 to 3)
          example: 1
          format: uint64
          type: integer
          x-go-name: Level
        size:
          description: Size of the cache (in bytes)
          example: 32768
          format: uint64
          type: integer
          x-go-name: Size
        type:
          description: Type of cache (Data, Instruction, Unified, ...)
          example: Data
          type: string
          x-go-name: Type
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesCPUCore:
      description: ResourcesCPUCore represents a CPU core on the system
      properties:
        core:
          description: Core identifier within the socket
          example: 0
          format: uint64
          type: integer
          x-go-name: Core
        die:
          description: 'What die the CPU is a part of (for chiplet designs)


            API extension: resources_cpu_core_die'
          example: 0
          format: uint64
          type: integer
          x-go-name: Die
        frequency:
          description: Current frequency
          example: 3500
          format: uint64
          type: integer
          x-go-name: Frequency
        threads:
          description: List of threads
          items:
            $ref: '#/components/schemas/ResourcesCPUThread'
          type: array
          x-go-name: Threads
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesGPUCardDRM:
      description: ResourcesGPUCardDRM represents the Linux DRM configuration of the GPU
      properties:
        card_device:
          description: Card device number
          example: '226:0'
          type: string
          x-go-name: CardDevice
        card_name:
          description: Card device name
          example: card0
          type: string
          x-go-name: CardName
        control_device:
          description: Control device number
          example: '226:0'
          type: string
          x-go-name: ControlDevice
        control_name:
          description: Control device name
          example: controlD64
          type: string
          x-go-name: ControlName
        id:
          description: DRM card ID
          example: 0
          format: uint64
          type: integer
          x-go-name: ID
        render_device:
          description: Render device number
          example: 226:128
          type: string
          x-go-name: RenderDevice
        render_name:
          description: Render device name
          example: renderD128
          type: string
          x-go-name: RenderName
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesGPU:
      description: ResourcesGPU represents the GPU resources available on the system
      properties:
        cards:
          description: List of GPUs
          items:
            $ref: '#/components/schemas/ResourcesGPUCard'
          type: array
          x-go-name: Cards
        total:
          description: Total number of GPUs
          example: 1
          format: uint64
          type: integer
          x-go-name: Total
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesNetworkCardPortInfiniband:
      description: ResourcesNetworkCardPortInfiniband represents the Linux Infiniband configuration for the port
      properties:
        issm_device:
          description: ISSM device number
          example: 231:64
          type: string
          x-go-name: IsSMDevice
        issm_name:
          description: ISSM device name
          example: issm0
          type: string
          x-go-name: IsSMName
        mad_device:
          description: MAD device number
          example: '231:0'
          type: string
          x-go-name: MADDevice
        mad_name:
          description: MAD device name
          example: umad0
          type: string
          x-go-name: MADName
        verb_device:
          description: Verb device number
          example: 231:192
          type: string
          x-go-name: VerbDevice
        verb_name:
          description: Verb device name
          example: uverbs0
          type: string
          x-go-name: VerbName
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesStorageDisk:
      description: ResourcesStorageDisk represents a disk
      properties:
        block_size:
          description: 'Block size


            API extension: resources_disk_sata'
          example: 512
          format: uint64
          type: integer
          x-go-name: BlockSize
        device:
          description: Device number
          example: '259:0'
          type: string
          x-go-name: Device
        device_fs_uuid:
          description: 'UUID of the filesystem on the device


            API extension: resources_device_fs_uuid'
          example: 9313518c-0e13-4067-9746-5c1703830b78
          type: string
          x-go-name: DeviceFSUUID
        device_id:
          description: 'Device by-id identifier


            API extension: resources_disk_id'
          example: nvme-eui.0000000001000000e4d25cafae2e4c00
          type: string
          x-go-name: DeviceID
        device_path:
          description: 'Device by-path identifier


            API extension: resources_disk_sata'
          example: pci-0000:05:00.0-nvme-1
          type: string
          x-go-name: DevicePath
        firmware_version:
          description: 'Current firmware version


            API extension: resources_disk_sata'
          example: PSF121C
          type: string
          x-go-name: FirmwareVersion
        id:
          description: ID of the disk (device name)
          example: nvme0n1
          type: string
          x-go-name: ID
        model:
          description: Disk model name
          example: INTEL SSDPEKKW256G7
          type: string
          x-go-name: Model
        mounted:
          description: Mounted status of the disk
          example: true
          type: boolean
          x-go-name: Mounted
        numa_node:
          description: NUMA node the disk is a part of
          example: 0
          format: uint64
          type: integer
          x-go-name: NUMANode
        partitions:
          description: List of partitions
          items:
            $ref: '#/components/schemas/ResourcesStorageDiskPartition'
          type: array
          x-go-name: Partitions
        pci_address:
          description: 'PCI address


            API extension: resources_disk_address'
          example: '0000:05:00.0'
          type: string
          x-go-name: PCIAddress
        read_only:
          description: Whether the disk is read-only
          example: false
          type: boolean
          x-go-name: ReadOnly
        removable:
          description: Whether the disk is removable (hot-plug)
          example: false
          type: boolean
          x-go-name: Removable
        rpm:
          description: 'Rotation speed (RPM)


            API extension: resources_disk_sata'
          example: 0
          format: uint64
          type: integer
          x-go-name: RPM
        serial:
          description: 'Serial number


            API extension: resources_disk_sata'
          example: BTPY63440ARH256D
          type: string
          x-go-name: Serial
        size:
          description: Total size of the disk (bytes)
          example: 256060514304
          format: uint64
          type: integer
          x-go-name: Size
        type:
          description: Storage type
          example: nvme
          type: string
          x-go-name: Type
        usb_address:
          description: 'USB address


            API extension: resources_disk_address'
          example: '3:5'
          type: string
          x-go-name: USBAddress
        used_by:
          description: 'Parent device type


            API extension: resources_disk_used_by'
          example: bcache
          type: string
          x-go-name: UsedBy
        wwn:
          description: WWN identifier
          example: eui.0000000001000000e4d25cafae2e4c00
          type: string
          x-go-name: WWN
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesSystemFirmware:
      description: ResourcesSystemFirmware represents the system firmware
      properties:
        date:
          description: Firmware build date
          example: 10/14/2020
          type: string
          x-go-name: Date
        vendor:
          description: Firmware vendor
          example: Lenovo
          type: string
          x-go-name: Vendor
        version:
          description: Firmware version
          example: N1MET64W (1.49)
          type: string
          x-go-name: Version
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesStorage:
      description: ResourcesStorage represents the local storage
      properties:
        disks:
          description: List of disks
          items:
            $ref: '#/components/schemas/ResourcesStorageDisk'
          type: array
          x-go-name: Disks
        total:
          description: Total number of partitions
          example: 1
          format: uint64
          type: integer
          x-go-name: Total
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesSystemChassis:
      description: ResourcesSystemChassis represents the system chassis
      properties:
        serial:
          description: Chassis serial number
          example: PY3DD4X9
          type: string
          x-go-name: Serial
        type:
          description: Chassis type
          example: Notebook
          type: string
          x-go-name: Type
        vendor:
          description: Chassis vendor
          example: Lenovo
          type: string
          x-go-name: Vendor
        version:
          description: Chassis version/revision
          example: None
          type: string
          x-go-name: Version
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesUSBDevice:
      description: ResourcesUSBDevice represents a USB device
      properties:
        bus_address:
          description: USB address (bus)
          example: 1
          format: uint64
          type: integer
          x-go-name: BusAddress
        device_address:
          description: USB address (device)
          example: 3
          format: uint64
          type: integer
          x-go-name: DeviceAddress
        interfaces:
          description: List of USB interfaces
          items:
            $ref: '#/components/schemas/ResourcesUSBDeviceInterface'
          type: array
          x-go-name: Interfaces
        product:
          description: Name of the product
          example: Hermon USB hidmouse Device
          type: string
          x-go-name: Product
        product_id:
          description: USB ID of the product
          example: '2221'
          type: string
          x-go-name: ProductID
        serial:
          description: 'USB serial number


            API extension: device_usb_serial.'
          example: DAE005fp
          type: string
          x-go-name: Serial
        speed:
          description: Transfer speed (Mbit/s)
          example: 12
          format: double
          type: number
          x-go-name: Speed
        vendor:
          description: Name of the vendor
          example: ATEN International Co., Ltd
          type: string
          x-go-name: Vendor
        vendor_id:
          description: USB ID of the vendor
          example: '0557'
          type: string
          x-go-name: VendorID
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesNetwork:
      description: ResourcesNetwork represents the network cards available on the system
      properties:
        cards:
          description: List of network cards
          items:
            $ref: '#/components/schemas/ResourcesNetworkCard'
          type: array
          x-go-name: Cards
        total:
          description: Total number of network cards
          example: 1
          format: uint64
          type: integer
          x-go-name: Total
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesCPUThread:
      description: ResourcesCPUThread represents a CPU thread on the system
      properties:
        id:
          description: Thread ID (used for CPU pinning)
          example: 0
          format: int64
          type: integer
          x-go-name: ID
        isolated:
          description: 'Whether the thread has been isolated (outside of normal scheduling)


            API extension: resource_cpu_isolated'
          example: false
          type: boolean
          x-go-name: Isolated
        numa_node:
          description: NUMA node the thread is a part of
          example: 0
          format: uint64
          type: integer
          x-go-name: NUMANode
        online:
          description: Whether the thread is online (enabled)
          example: true
          type: boolean
          x-go-name: Online
        thread:
          description: Thread identifier within the core
          example: 0
          format: uint64
          type: integer
          x-go-name: Thread
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    ResourcesNetworkCardVDPA:
      description: ResourcesNetworkCardVDPA represents the VDPA configuration of the network card
      properties:
        device:
          description: Device identifier of the VDPA device
          type: string
          x-go-name: Device
        name:
          description: Name of the VDPA device
          type: string
          x-go-name: Name
      type: object
      x-go-package: github.com/canonical/lxd/shared/api
    Server:
      description: Server represents a LXD server
      properties:
        access_entitlements:
          description: AccessEntitlements represents the entitlements that are granted to the requesting user on the attached entity.
          example:
          - can_view
          - can_edit
