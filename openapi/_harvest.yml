not_harvested:
  - api: canonical:maas-api
    reason: >-
      MAAS generates its OpenAPI at runtime from the running region controller
      (src/maasserver/templates/openapi.html + an API handler), so there is no static document to
      fetch and no public MAAS instance to fetch it from. `maas login` builds the CLI surface from
      the same runtime description.
  - api: canonical:juju-api
    reason: >-
      Juju's controller API is a websocket RPC surface documented as facade schemas, not OpenAPI. Its
      schema.json in the juju/juju repository is a real machine-readable contract but not a type this
      pipeline registers.
  - api: canonical:snap-store-api
    reason: >-
      Canonical publishes no machine-readable contract for api.snapcraft.io. The docs at
      https://api.snapcraft.io/docs are a rendered reference only; probes of /openapi.json,
      /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs and /redoc on api.snapcraft.io and
      dashboard.snapcraft.io all returned 404 on 2026-09-05.
  - api: canonical:charmhub-api
    reason: >-
      Same as the Snap Store — a rendered reference at https://api.charmhub.io/docs with no spec
      behind it. api.charmhub.io additionally answers every /.well-known/ path with HTTP 400.
  - api: canonical:launchpad-api
    reason: >-
      Launchpad self-describes with WADL (lazr.restful), not OpenAPI. WADL is not a contract type
      this pipeline registers, and nothing was fabricated in its place.
