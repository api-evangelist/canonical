          description: Validation error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPError'
          description: Not found
      tags:
      - v1
      summary: Post logs for a specified job ID
      description: 'Agents stream log data in sequential fragments. Each request must

        include:


        - ``fragment_number``: sequential integer starting from 0

        - ``timestamp``: ISO 8601 timestamp when the fragment was created

        - ``phase``: test phase name (setup, provision, firmware_update, test,

        allocate, reserve, cleanup)

        - ``log_data``: the log content for this fragment


        :param job_id: UUID as a string for the job

        :param log_type: LogType enum value for the type of log being posted

        :raises HTTPError: If the job_id is not a valid UUID

        :param json_data: Dictionary with log data'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogPost'
      operationId: postV1ResultByJobIdLogByLogType
      x-operation-id-source: derived
components:
  schemas:
    ResultGet:
      type: object
      properties:
        setup_status:
          type: integer
        provision_status:
          type: integer
        firmware_update_status:
          type: integer
        test_status:
          type: integer
        allocate_status:
          type: integer
        reserve_status:
          type: integer
        cleanup_status:
          type: integer
        job_state:
          type: string
        setup_output:
          type: string
        setup_serial:
          type: string
        provision_output:
          type: string
        provision_serial:
          type: string
        firmware_update_output:
          type: string
        firmware_update_serial:
          type: string
        test_output:
          type: string
        test_serial:
          type: string
        allocate_output:
          type: string
        allocate_serial:
          type: string
        reserve_output:
          type: string
        reserve_serial:
          type: string
        cleanup_output:
          type: string
        cleanup_serial:
          type: string
        device_info:
          type: object
          additionalProperties: {}
        cancelled_by:
          type:
          - string
          - 'null'
          default: null
      additionalProperties: false
    LogGetItem:
      type: object
      properties:
        last_fragment_number:
          type: integer
        log_data:
          type: string
      required:
      - last_fragment_number
      - log_data
      additionalProperties: false
    ClientPermissionsOut:
      type: object
      properties:
        client_id:
          type: string
        max_priority:
          type:
          - object
          - 'null'
          additionalProperties:
            type: integer
        allowed_queues:
          type:
          - array
          - 'null'
          items:
            type: string
        max_reservation_time:
          type:
          - object
          - 'null'
          additionalProperties: {}
        role:
          type: string
        email:
          type:
          - string
          - 'null'
          format: email
      required:
      - allowed_queues
      - client_id
      - max_priority
      - max_reservation_time
      - role
      additionalProperties: false
    ResultStatus:
      type: object
      properties:
        setup_status:
          type: integer
        provision_status:
          type: integer
        firmware_update_status:
          type: integer
        test_status:
          type: integer
        allocate_status:
          type: integer
        reserve_status:
          type: integer
        cleanup_status:
          type: integer
        job_state:
          type: string
      additionalProperties: false
    HTTPError:
      properties:
        detail:
          type: object
        message:
          type: string
      type: object
    JobEvent:
      type: object
      properties:
        event_name:
          type: string
        timestamp:
          type: string
        detail:
          type: string
      required:
      - event_name
      - timestamp
      additionalProperties: false
    Attachment:
      type: object
      properties:
        agent:
          type: string
        device:
          type: string
      required:
      - agent
      additionalProperties: false
    StatusUpdate:
      type: object
      properties:
        agent_id:
          type: string
        job_queue:
          type: string
        job_status_webhook:
          type: string
          format: url
        events:
          type: array
          items:
            $ref: '#/components/schemas/JobEvent'
      required:
      - job_status_webhook
      additionalProperties: false
    RestrictedQueueOut:
      type: object
      properties:
        queue:
          type: string
        owners:
          type: array
          items:
            type: string
      required:
      - owners
      - queue
      additionalProperties: false
    LogGet:
      type: object
      properties:
        output:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LogGetItem'
        serial:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/LogGetItem'
      additionalProperties: false
    RestrictedQueueIn:
      type: object
      properties:
        client_id:
          type: string
      required:
      - client_id
      additionalProperties: false
    RefreshTokenIn:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 1
      required:
      - refresh_token
      additionalProperties: false
    ActionIn:
      type: object
      properties:
        action:
          type: string
          enum:
          - cancel
      required:
      - action
      additionalProperties: false
    Job:
      type: object
      properties:
        job_id:
          type: string
        parent_job_id:
          type: string
        name:
          type: string
        tags:
          type: array
          items:
            type: string
        job_queue:
          type: string
          minLength: 1
        global_timeout:
          type: integer
        output_timeout:
          type: integer
        allocation_timeout:
          type: integer
        provision_data:
