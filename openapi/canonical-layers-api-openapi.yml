openapi: 3.2.0
info:
  title: Pebble Layers API
  version: v1
tags:
- name: Layers
paths:
  /v1/layers:
    post:
      summary: Add a layer to the plan
      tags:
      - Layers
      description: Add a layer to the plan's configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  description: The action to perform.
                  enum:
                  - add
                combine:
                  type: boolean
                  description: Whether to combine the layer with existing layers (if true) or append it (if false).
                inner:
                  type: boolean
                  description: Whether to add the layer as an inner layer.
                label:
                  type: string
                  description: The label for the layer.
                  minLength: 1
                format:
                  type: string
                  description: The format of the layer.
                  enum:
                  - yaml
                layer:
                  type: string
                  description: The layer data in YAML format.
      responses:
        '200':
          description: Layer added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostLayersResponse'
              example:
                type: sync
                status-code: 200
                status: OK
                result: true
      operationId: postV1Layers
      x-operation-id-source: derived
components:
  schemas:
    BaseResponse:
      type: object
      properties:
        type:
          type: string
          description: Response type, "sync".
        status-code:
          type: integer
          description: HTTP response status code.
        status:
          type: string
          description: 'The description of the HTTP status code.


            See the [IANA list](https://www.iana.org/assignments/http-status-codes/http-status-codes.xhtml).

            '
    PostLayersResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          result:
            type: boolean
            const: true
