openapi: 3.2.0
info:
  title: Canonical Instances API
  version: '1.0'
  description: 'Operations tagged instances across 2 of this provider''s published API definitions: canonical-anbox-cloud-ams-api-openapi.json, canonical-lxd-rest-api-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Instances
paths:
  /1.0/instances:
    get:
      description: This endpoint returns a list of instance API endpoints.
      tags:
      - Instances
      summary: Get a list of instances
      operationId: instances_get
      parameters:
      - description: Maximum number of instances to provide
        name: limit
        in: query
        schema:
          type: integer
      - description: Offset at which to start with listing instances
        name: offset
        in: query
        schema:
          type: integer
      - description: Expand the returned resource definition
        name: recursion
        in: query
        schema:
          type: integer
          enum:
          - 0
          - 1
          default: 0
      - example: cilsreunfpfec9b1ktg0
        description: Filter instances by id. This is an exact match for the string.
        name: id
        in: query
        schema:
          type: string
      - example: ams-cilsreunfpfec9b1ktg0
        description: Filter instances by name. This is an exact match for the string.
        name: name
        in: query
        schema:
          type: string
      - example: true
        description: Filter base instances. The instances which are not base, are regular instances.
        name: base
        in: query
        schema:
          type: boolean
      - description: Filter instances by type.
        name: type
        in: query
        schema:
          type: string
          enum:
          - vm
          - container
      - description: Filter instances by status.
        name: status
        in: query
        schema:
          type: string
          enum:
          - created
          - prepared
          - stopped
          - running
          - error
          - deleted
      - example: lxd0
        description: Filter instances by the LXD node name.
        name: node
        in: query
        schema:
          type: string
      - example: cilsiomnfpfec9b1kteg
        description: Filter instances by the application ID. This is an exact match for the string.
        name: app_id
        in: query
        schema:
          type: string
      - example: my-app
        description: Filter instances by the application name. This is an exact match for the string.
        name: app_name
        in: query
        schema:
          type: string
      - example: 0
        description: Filter instances by the application version.
        name: app_version
        in: query
        schema:
          type: integer
      - example: cilshrmnfpfec9b1kte0
        description: Filter instances by the image ID. This is an exact match for the string.
        name: image_id
        in: query
        schema:
          type: string
      - example: 0
        description: Filter instances by the image version.
        name: image_version
        in: query
        schema:
          type: integer
      - example: created_by=anbox,foo,bar
        description: Filter instances by tags.
        name: tags
        in: query
        schema:
          type: string
      responses:
        '200':
          description: API endpoints
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/NoMetaSyncResponse'
                properties:
                  metadata:
                    description: List of endpoints
                    type: array
                    items:
                      type: string
                    example: "[\n  \"/1.0/instances/foo\",\n  \"/1.0/instances/bar\"\n]"
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      description: 'This endpoint creates a new instance instance with the provided specification.

        If AMS cannot fullfil the resource requirements for creating the instance,

        the request will fail.'
      tags:
      - Instances
      summary: Create a new instance
      operationId: instances_post
      responses:
        '202':
          description: Success response of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstancesPost'
        description: Specification of the instance to create
    delete:
      description: 'This endpoint deletes all specified instances. If the deletion of a single

        instance fails, the operation is aborted and an error is returned.'
      tags:
      - Instances
      summary: Delete multiple instances
      operationId: instances_delete
      responses:
        '202':
          description: Success response of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstancesDelete'
        description: List of instances to delete
    put:
      description: Changes the running state of all instances.
      operationId: instances_put
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '202':
          $ref: '#/components/responses/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Bulk instance state update
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstancesPut'
        description: State
  /1.0/instances/{id_or_name}:
    get:
      description: This endpoint returns information about a specific instance instance.
      tags:
      - Instances
      summary: Get information about a specific instance instance
      operationId: instance_get
      parameters:
      - name: id_or_name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Instance instance details
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/NoMetaSyncResponse'
                properties:
                  metadata:
                    $ref: '#/components/schemas/Instance'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: 'This endpoint deletes a specific instance. The deletion process happens

        asynchronously. The operation progress can be checked via the returned

        operation object.'
      tags:
      - Instances
      summary: Delete a specific instance
      operationId: instance_delete
      parameters:
      - name: id_or_name
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Success response of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceDelete'
        description: Additional details for the delete operation.
    patch:
      description: This endpoint allows changing the state of a specific instance instance.
      tags:
      - Instances
      summary: Update the state of a specific instance instance
      operationId: instance_patch
      parameters:
      - name: id_or_name
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Success response of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstancePatch'
  /1.0/instances/{id_or_name}/exec:
    post:
      description: 'This endpoint is used to run a command in the instance. The endpoint returns

        an operation which will contain either 2 or 4 websockets.

        In non-interactive mode, you''ll get one websocket for each of stdin, stdout and stderr.

        In interactive mode, a single bi-directional websocket is used for stdin and stdout/stderr.


        An additional "control" socket is always added on top which can be used for out of band

        communication with LXD. This allows sending signals and window sizing information through.'
      tags:
      - Instances
      summary: Execute a command in a instance
      operationId: instance_exec_post
      parameters:
      - name: id_or_name
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Success response of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceExecPost'
        description: Exec request
  /1.0/instances/{id_or_name}/logs:
    get:
      description: 'This endpoint returns a instance''s collected log files. If a instance has

        been set to status "error" AMS will automatically collect, logs for further

        inspection.'
      tags:
      - Instances
      summary: Get a list of collected log files for the instance
      operationId: instance_logs_get
      parameters:
      - name: id_or_name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Collected log files
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/NoMetaSyncResponse'
                properties:
                  metadata:
                    description: List of collected logs
                    type: array
                    items:
                      type: string
                    example: "[\n \"/1.0/instances/cilsiomnfpfec9b1kteg/logs/android.log\",\n \"/1.0/instances/cilsiomnfpfec9b1kteg/logs/system.log\"\n]"
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /1.0/instances/{id_or_name}/logs/{name}:
    get:
      description: This endpoint returns the collected log file as a raw file.
      tags:
      - Instances
      summary: Retrieve a specific log file stored for the instance
      operationId: instance_logs_specific_get
      parameters:
      - name: id_or_name
        in: path
        required: true
        schema:
          type: string
      - description: Name of the log to retrieve
        name: name
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Raw file
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /1.0/instances?recursion=1:
    get:
      description: This endpoint returns a list of instances.
      tags:
      - Instances
      summary: Get a list of instances
      operationId: instances_get_recursion1
      parameters:
      - description: Maximum number of instances to provide
        name: limit
        in: query
        schema:
          type: integer
      - description: Offset at which to start with listing instances
        name: offset
        in: query
        schema:
          type: integer
      - description: Expand the returned resource definition
        name: recursion
        in: query
        schema:
          type: integer
          enum:
          - 0
          - 1
          default: 0
      - example: cilsreunfpfec9b1ktg0
        description: Filter instances by id. This is an exact match for the string.
        name: id
        in: query
        schema:
          type: string
      - example: ams-cilsreunfpfec9b1ktg0
        description: Filter instances by name. This is an exact match for the string.
        name: name
        in: query
        schema:
          type: string
      - example: true
        description: Filter base instances. The instances which are not base, are regular instances.
        name: base
        in: query
        schema:
          type: boolean
      - description: Filter instances by type.
        name: type
        in: query
        schema:
          type: string
          enum:
          - vm
          - container
      - description: Filter instances by status.
        name: status
        in: query
        schema:
          type: string
          enum:
          - created
          - prepared
          - stopped
          - running
          - error
          - deleted
      - example: lxd0
        description: Filter instances by the LXD node name.
        name: node
        in: query
        schema:
          type: string
      - example: cilsiomnfpfec9b1kteg
        description: Filter instances by the application ID. This is an exact match for the string.
        name: app_id
        in: query
        schema:
          type: string
      - example: my-app
        description: Filter instances by the application name. This is an exact match for the string.
        name: app_name
        in: query
        schema:
          type: string
      - example: 0
        description: Filter instances by the application version.
        name: app_version
        in: query
        schema:
          type: integer
      - example: cilshrmnfpfec9b1kte0
        description: Filter instances by the image ID. This is an exact match for the string.
        name: image_id
        in: query
        schema:
          type: string
      - example: 0
        description: Filter instances by the image version.
        name: image_version
        in: query
        schema:
          type: integer
      - example: created_by=anbox,foo,bar
        description: Filter instances by tags.
        name: tags
        in: query
        schema:
          type: string
      responses:
        '200':
          description: API endpoints
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/NoMetaSyncResponse'
                properties:
                  metadata:
                    description: List of instances
                    type: array
                    items:
                      $ref: '#/components/schemas/Instance'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /1.0/instances/{name}:
    delete:
      description: 'Deletes a specific instance.


        This also deletes anything owned by the instance such as snapshots and backups.'
      operationId: instance_delete
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      - description: Force delete of running instances
        in: query
        name: force
        schema:
          type: boolean
      responses:
        '202':
          $ref: '#/components/responses/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Delete an instance
      tags:
      - Instances
    get:
      description: Gets a specific instance (basic struct).
      operationId: instance_get
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '200':
          description: Instance
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    $ref: '#/components/schemas/Instance_2'
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Get the instance
      tags:
      - Instances
    patch:
      description: Updates a subset of the instance configuration
      operationId: instance_patch
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/EmptySyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Partially update the instance
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstancePut'
        description: Update request
    post:
      description: 'Renames, moves an instance between pools or migrates an instance to another server.


        The returned operation metadata will vary based on what''s requested.

        For rename or move within the same server, this is a simple background operation with progress data.

        For migration, in the push case, this will similarly be a background

        operation with progress data, for the pull case, it will be a websocket

        operation with a number of secrets to be passed to the target server.'
      operationId: instance_post
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '202':
          $ref: '#/components/responses/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Rename or move/migrate an instance
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstancePost'
        description: Migration request
    put:
      description: Updates the instance configuration or trigger a snapshot restore.
      operationId: instance_put
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '202':
          $ref: '#/components/responses/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Update the instance
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstancePut'
        description: Update request
  /1.0/instances/{name}/backups:
    get:
      description: Returns a list of instance backups (URLs).
      operationId: instance_backups_get
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '200':
          description: API endpoints
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    description: List of endpoints
                    example: "[\n  \"/1.0/instances/foo/backups/backup0\",\n  \"/1.0/instances/foo/backups/backup1\"\n]"
                    items:
                      type: string
                    type: array
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Get the backups
      tags:
      - Instances
    post:
      description: Creates a new backup.
      operationId: instance_backups_post
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '202':
          $ref: '#/components/responses/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Create a backup
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceBackupsPost'
        description: Backup request
  /1.0/instances/{name}/backups/{backup}:
    delete:
      description: Deletes the instance backup.
      operationId: instance_backup_delete
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '202':
          $ref: '#/components/responses/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Delete a backup
      tags:
      - Instances
    get:
      description: Gets a specific instance backup.
      operationId: instance_backup_get
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '200':
          description: Instance backup
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    $ref: '#/components/schemas/InstanceBackup'
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Get the backup
      tags:
      - Instances
    post:
      description: Renames an instance backup.
      operationId: instance_backup_post
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '202':
          $ref: '#/components/responses/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Rename a backup
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceBackupPost'
        description: Backup rename
  /1.0/instances/{name}/backups/{backup}/export:
    get:
      description: Download the raw backup file(s) from the server.
      operationId: instance_backup_export
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '200':
          description: Raw image data
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Get the raw backup file(s)
      tags:
      - Instances
  /1.0/instances/{name}/backups?recursion=1:
    get:
      description: Returns a list of instance backups (structs).
      operationId: instance_backups_get_recursion1
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '200':
          description: API endpoints
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    description: List of instance backups
                    items:
                      $ref: '#/components/schemas/InstanceBackup'
                    type: array
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Get the backups
      tags:
      - Instances
  /1.0/instances/{name}/console:
    delete:
      description: Clears the console log buffer.
      operationId: instance_console_delete
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/EmptySyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
