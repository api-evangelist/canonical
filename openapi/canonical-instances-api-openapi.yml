      responses:
        '200':
          description: API endpoints
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    description: List of instance snapshots
                    items:
                      $ref: '#/components/schemas/InstanceSnapshot'
                    type: array
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Get the snapshots
      tags:
      - Instances
  /1.0/instances/{name}/state:
    get:
      description: 'Gets the runtime state of the instance.


        This is a reasonably expensive call as it causes code to be run

        inside of the instance to retrieve the resource usage and network

        information.'
      operationId: instance_state_get
      parameters:
      - description: Project name
        in: query
        name: project
        schema:
          type: string
      responses:
        '200':
          description: State
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    $ref: '#/components/schemas/InstanceState'
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Get the runtime state
      tags:
      - Instances
    put:
      description: Changes the running state of the instance.
      operationId: instance_state_put
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '202':
          $ref: '#/components/responses/Operation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Change the state
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceStatePut'
        description: State
  /1.0/instances/{name}/uefi-vars:
    get:
      description: Gets the UEFI variables for a specific VM.
      operationId: instance_uefi_vars_get
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '200':
          description: Instance UEFI variables
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    $ref: '#/components/schemas/InstanceUEFIVars'
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Get the instance's UEFI variables
      tags:
      - Instances
    put:
      description: Sets the UEFI variables for a specific VM.
      operationId: instance_uefi_vars_put
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/EmptySyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Set the instance's UEFI variables
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceUEFIVars'
        description: UEFI variables update request
  /1.0/instances/{name}?recursion=1:
    get:
      description: 'Gets a specific instance (full struct).


        recursion=1 also includes information about state, snapshots and backups.


        Selective recursion is supported using semicolon-separated syntax in the recursion parameter:

        recursion=2;fields=state.disk,state.network to fetch only specific state fields.

        Valid fields are: state.disk, state.network.

        Use recursion=2;fields= to fetch instance data without any expensive state fields.'
      operationId: instance_get_recursion1
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      - description: Recursion level (0, 1, 2) or selective recursion (2;fields=state.disk,state.network)
        example: 2;fields=state.disk
        in: query
        name: recursion
        schema:
          type: string
      responses:
        '200':
          description: Instance
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    $ref: '#/components/schemas/Instance_2'
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Get the instance
      tags:
      - Instances
  /1.0/instances?recursion=2:
    get:
      description: 'Returns a list of instances (full structs).


        The main difference between recursion=1 and recursion=2 is that the

        latter also includes state and snapshot information allowing for a

        single API call to return everything needed by most clients.'
      operationId: instances_get_recursion2
      parameters:
      - description: Project name
        example: default
        in: query
        name: project
        schema:
          type: string
      - description: Collection filter
        example: default
        in: query
        name: filter
        schema:
          type: string
      - description: Retrieve instances from all projects
        in: query
        name: all-projects
        schema:
          type: boolean
      - description: Recursion level (0, 1, 2)
        example: 2
        in: query
        name: recursion
        schema:
          type: string
      responses:
        '200':
          description: API endpoints
          content:
            application/json:
              schema:
                description: Sync response
                properties:
                  metadata:
                    description: List of instances
                    items:
                      $ref: '#/components/schemas/InstanceFull'
                    type: array
                  status:
                    description: Status description
                    example: Success
                    type: string
                  status_code:
                    description: Status code
                    example: 200
                    type: integer
                  type:
                    description: Response type
                    example: sync
                    type: string
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
      summary: Get the instances
      tags:
      - Instances
