        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithErrors'
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/CVEImport'
              type: array
      tags:
      - Security
      summary: Replace security updates cves json
      x-summary-source: derived
      operationId: putSecurityUpdatesCvesJson
      x-operation-id-source: derived
  /security/updates/cves/{cve_id}.json:
    delete:
      parameters:
      - in: path
        name: cve_id
