      tags:
      - Security
      summary: Get security releases json
      x-summary-source: derived
      operationId: getSecurityReleasesJson
      x-operation-id-source: derived
  /security/releases/{release_codename}.json:
    get:
      parameters:
      - in: path
        name: release_codename
        required: true
        schema:
