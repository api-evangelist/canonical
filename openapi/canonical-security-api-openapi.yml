components:
  schemas:
    CveImpact:
      properties:
        baseMetricV3:
          $ref: '#/components/schemas/CveBaseMetric'
        baseMetricV4:
          $ref: '#/components/schemas/CveBaseMetricV4'
      type: object
    CvssV4SupplementalMetrics:
      properties:
        automatable:
          type:
          - string
          - 'null'
        providerUrgency:
          type:
          - string
          - 'null'
        recovery:
          type:
          - string
          - 'null'
        safety:
          type:
          - string
          - 'null'
        valueDensity:
          type:
          - string
          - 'null'
        vulnerabilityResponseEffort:
          type:
          - string
          - 'null'
      type: object
    RelatedNotices:
      properties:
        id:
          type: string
        packages:
          type: string
      type: object
    CvssV4EnvironmentalMetricsImport:
      properties:
        modifiedBaseMetrics:
          allOf:
          - $ref: '#/components/schemas/CvssV4ModifiedBaseMetricsImport'
        securityRequirements:
          allOf:
          - $ref: '#/components/schemas/CvssV4SecurityRequirements'
      type: object
    CvssV4Import:
      properties:
        baseEnvironmentalScore:
          type:
          - number
          - 'null'
        baseEnvironmentalSeverity:
          type:
          - string
          - 'null'
        baseMetrics:
          allOf:
          - $ref: '#/components/schemas/CvssV4BaseMetricsImport'
        baseScore:
          type:
          - number
          - 'null'
        baseSeverity:
          type:
          - string
          - 'null'
        baseThreatEnvironmentalScore:
          type:
          - number
          - 'null'
        baseThreatEnvironmentalSeverity:
          type:
          - string
          - 'null'
        baseThreatScore:
          type:
          - number
          - 'null'
        baseThreatSeverity:
          type:
          - string
          - 'null'
        environmentalMetrics:
          allOf:
          - $ref: '#/components/schemas/CvssV4EnvironmentalMetricsImport'
        supplementalMetrics:
          allOf:
          - $ref: '#/components/schemas/CvssV4SupplementalMetrics'
        threatMetrics:
          allOf:
          - $ref: '#/components/schemas/CvssV4ThreatMetrics'
        vectorString:
          type:
          - string
          - 'null'
        version:
          type:
          - string
          - 'null'
      type: object
    CveImpactImport:
      properties:
        baseMetricV3:
          $ref: '#/components/schemas/CveBaseMetric'
        baseMetricV4:
          $ref: '#/components/schemas/CveBaseMetricV4Import'
      type: object
    NoticeAPI:
      properties:
        cves_ids:
          items:
            pattern: (cve-|CVE-)\d{4}-\d{4,7}
            type: string
          type: array
        description:
          type:
          - string
          - 'null'
        id:
          pattern: (USN|LSN|SSN)-\d{1,5}-\d{1,2}
          type: string
        instructions:
          type: string
        is_hidden:
          type: boolean
        published:
          format: date-time
          type: string
        references:
          items:
            type: string
          type: array
        release_packages:
          additionalProperties:
            items:
              $ref: '#/components/schemas/NoticePackage'
            type: array
          type: object
        summary:
          type: string
        title:
          type: string
        type:
          type: string
      required:
      - id
      - instructions
      - published
      - summary
      - title
      type: object
    CvssV4ThreatMetrics:
      properties:
        exploitMaturity:
          type:
          - string
          - 'null'
      type: object
    Release:
      properties:
        codename:
          type: string
        development:
          type: boolean
        esm_expires:
          format: date-time
          type: string
        lts:
          type: boolean
        name:
          type: string
        release_date:
          format: date-time
          type: string
        support_expires:
          format: date-time
          type: string
        version:
          type: string
      required:
      - codename
      - development
      - esm_expires
      - lts
      - name
      - release_date
      - support_expires
      - version
      type: object
    CvePackage:
      properties:
        debian:
          type: string
        name:
          type: string
        source:
          type: string
        statuses:
          items:
            $ref: '#/components/schemas/Status'
          type: array
        ubuntu:
          type: string
      required:
      - debian
      - name
      - source
      - ubuntu
      type: object
    NoticeReleases:
      properties:
        codename:
          type: string
        support_tag:
          type: string
        version:
          type: string
      type: object
    CvssV4:
      properties:
        baseEnvironmentalScore:
          type:
          - number
          - 'null'
        baseEnvironmentalSeverity:
          type:
          - string
          - 'null'
        baseMetrics:
          $ref: '#/components/schemas/CvssV4BaseMetrics'
        baseScore:
          type:
          - number
          - 'null'
        baseSeverity:
          type:
          - string
          - 'null'
        baseThreatEnvironmentalScore:
          type:
          - number
          - 'null'
        baseThreatEnvironmentalSeverity:
          type:
          - string
          - 'null'
        baseThreatScore:
          type:
          - number
          - 'null'
        baseThreatSeverity:
          type:
          - string
          - 'null'
        environmentalMetrics:
          $ref: '#/components/schemas/CvssV4EnvironmentalMetrics'
        supplementalMetrics:
          $ref: '#/components/schemas/CvssV4SupplementalMetrics'
        threatMetrics:
          $ref: '#/components/schemas/CvssV4ThreatMetrics'
        vectorString:
          type:
          - string
          - 'null'
        version:
          type:
          - string
          - 'null'
      type: object
    NoticeImport:
      properties:
        cves:
          items:
            pattern: (cve-|CVE-)\d{4}-\d{4,7}
            type: string
          type: array
        description:
          type:
          - string
          - 'null'
        id:
          pattern: (USN|LSN|SSN)-\d{1,5}-\d{1,2}
          type: string
        instructions:
