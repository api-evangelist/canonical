openapi: 3.2.0
info:
  title: Ubuntu Security API
  version: v1
tags:
- name: Security
paths:
  /security/compat/notices.json:
    get:
      parameters:
      - description: Any string - Selects notices that have either id, details or cves.id matching it.
        in: query
        name: details
        required: false
        schema:
          type: string
      - description: CVE ID to filter notices by.
        in: query
        name: cve_id
        required: false
        schema:
          type: string
      - description: Comma-separated list of CVE IDs to filter notices by.
        in: query
        name: cves
        required: false
        schema:
          type: string
      - description: 'Ubuntu release codename to filter notices by.example: `"noble"`.'
        in: query
        name: release
        required: false
        schema:
          type: string
      - description: Number of Notices per response.Defaults to `10`. Max `20`.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 10
          maximum: 20
          minimum: 1
      - description: Number of Notices to omit from response.Defaults to `0`.
        in: query
        name: offset
        required: false
        schema:
          type: integer
          default: 0
      - description: 'Select order: choose `oldest` for ASC order; `newest` for DESC order. Default is `newest`.'
        in: query
        name: order
        required: false
        schema:
          type: string
          default: newest
      - description: True or False if you want to select hidden notices. Default is `false`.
        in: query
        name: show_hidden
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticesAPI'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithErrors'
      tags:
      - Security
      summary: Get security compat notices json
      x-summary-source: derived
      operationId: getSecurityCompatNoticesJson
      x-operation-id-source: derived
  /security/compat/notices/{notice_id}.json:
    get:
      parameters:
      - description: True or False if you want to select hidden notices. Default is `false`.
        in: query
        name: show_hidden
        required: false
        schema:
          type: boolean
      - in: path
        name: notice_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeAPIDetailed'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      tags:
      - Security
      summary: Get security compat notices {notice id} json
      x-summary-source: derived
      operationId: getSecurityCompatNotices{noticeId}Json
      x-operation-id-source: derived
  /security/cves.json:
    get:
      parameters:
      - description: Any string -  Selects CVEs that have either id, description or ubuntu_description matching it
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: CVE priority
        in: query
        name: priority
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: Package name
        in: query
        name: package
        required: false
        schema:
          type: string
      - description: Number of CVEs per response. Defaults to 10. Max 20.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
      - description: Number of CVEs to omit from response. Defaults to 0.
        in: query
        name: offset
        required: false
        schema:
          type: integer
      - description: Package component
        in: query
        name: component
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: 'List of release codenames '
        in: query
        name: version
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: CVE status
        in: query
        name: cve_status
        required: false
        schema:
          type: string
          enum:
          - not-in-ubuntu
          - active
          - rejected
      - description: List of package statuses
        in: query
        name: status
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - description: Select `ascending` or `oldest` (depreciated) for ASC order;leave empty for descending order
        in: query
        name: order
        required: false
        schema:
          type: string
          enum:
          - oldest, descending, ascending
          default: descending
      - description: Select `priority` to group CVEs by highest to lowest priority
        in: query
        name: group_by
        required: false
        schema:
          type: string
          enum:
          - priority
      - description: Select `updated` to sort by most recently updated CVEs;leave empty to sort by publish date
        in: query
        name: sort_by
        required: false
        schema:
          type: string
          enum:
          - updated
          - published
          default: published
      - description: True or False if you want to select hidden notices. Default is False.
        in: query
        name: show_hidden
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CVEsAPI'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithErrors'
      tags:
      - Security
      summary: Get security cves json
      x-summary-source: derived
      operationId: getSecurityCvesJson
      x-operation-id-source: derived
  /security/cves/{cve_id}.json:
    get:
      parameters:
      - description: True or False if you want to select hidden notices. Default is False.
        in: query
        name: show_hidden
        required: false
        schema:
          type: boolean
      - in: path
        name: cve_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CVEAPIDetailed'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      tags:
      - Security
      summary: Get security cves {cve id} json
      x-summary-source: derived
      operationId: getSecurityCves{cveId}Json
      x-operation-id-source: derived
  /security/notices.json:
    get:
      parameters:
      - description: Any string - Selects notices that have either id, details or cves.id matching it.
        in: query
        name: details
        required: false
        schema:
          type: string
      - description: CVE ID to filter notices by.
        in: query
        name: cve_id
        required: false
        schema:
          type: string
      - description: Comma-separated list of CVE IDs to filter notices by.
        in: query
        name: cves
        required: false
        schema:
          type: string
      - description: 'Ubuntu release codename to filter notices by.example: `"noble"`.'
        in: query
        name: release
        required: false
        schema:
          type: string
      - description: Number of Notices per response.Defaults to `10`. Max `20`.
        in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 10
          maximum: 20
          minimum: 1
      - description: Number of Notices to omit from response.Defaults to `0`.
        in: query
        name: offset
        required: false
        schema:
          type: integer
          default: 0
      - description: 'Select order: choose `oldest` for ASC order; `newest` for DESC order. Default is `newest`.'
        in: query
        name: order
        required: false
        schema:
          type: string
          default: newest
      - description: True or False if you want to select hidden notices. Default is `false`.
        in: query
        name: show_hidden
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticesAPISchemaV2'
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithErrors'
      tags:
      - Security
      summary: Get security notices json
      x-summary-source: derived
      operationId: getSecurityNoticesJson
      x-operation-id-source: derived
  /security/notices/{notice_id}.json:
    get:
      parameters:
      - description: True or False if you want to select hidden notices. Default is `false`.
        in: query
        name: show_hidden
        required: false
        schema:
          type: boolean
      - in: path
        name: notice_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeAPIDetailedSchemaV2'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      tags:
      - Security
      summary: Get security notices {notice id} json
      x-summary-source: derived
      operationId: getSecurityNotices{noticeId}Json
      x-operation-id-source: derived
  /security/page/notices.json:
    get:
      parameters:
      - description: Any string - Selects notices that have either id, details or cves.id matching it.
