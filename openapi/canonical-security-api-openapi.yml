      summary: Get security page notices json
      x-summary-source: derived
      operationId: getSecurityPageNoticesJson
      x-operation-id-source: derived
  /security/releases.json:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleasesAPI'
        '404':
          description: ''
          content:
