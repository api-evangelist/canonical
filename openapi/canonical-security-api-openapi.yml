      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseAPI'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      tags:
      - Security
      summary: Get security releases {release codename} json
      x-summary-source: derived
      operationId: getSecurityReleases{releaseCodename}Json
      x-operation-id-source: derived
  /security/updates/cves.json:
    put:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: ''
          content:
