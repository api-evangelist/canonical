openapi: 3.2.0
info:
  title: Canonical Applications API
  version: '1.0'
  description: 'Operations tagged applications across 3 of this provider''s published API definitions: canonical-anbox-cloud-ams-api-openapi.json, canonical-cos-registration-server-api-openapi.yml, canonical-test-observer-api-openapi.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Applications
paths:
  /1.0/applications:
    get:
      description: This endpoint returns a list of available applications.
      tags:
      - Applications
      summary: Get a list of applications
      operationId: applications_get
      parameters:
      - description: Index to start listing the records
        name: offset
        in: query
        schema:
          type: integer
          default: 0
      - description: Limit the number of returned records
        name: limit
        in: query
        schema:
          type: integer
          default: -1
      - description: Expand the returned resource definition
        name: recursion
        in: query
        schema:
          type: integer
          enum:
          - 0
          - 1
          default: 0
      - example: btavtegj1qm58qg7ru50
        description: Filter applications by id. This is an exact match for the string.
        name: id
        in: query
        schema:
          type: string
      - example: my-app
        description: Filter applications by name. This is an exact match for the string.
        name: name
        in: query
        schema:
          type: string
      - example: a2.3
        description: Filter applications by their instance_type.
        name: instance_type
        in: query
        schema:
          type: string
      - example: initializing
        description: Filter applications by status.
        name: status
        in: query
        schema:
          type: string
          enum:
          - initializing
          - ready
          - error
          - deleted
      - example: com.foo.bar
        description: Filter applications by their boot package.
        name: boot_package
        in: query
        schema:
          type: string
      - example: false
        description: Filter immutable applications.
        name: immutable
        in: query
        schema:
          type: boolean
      - example: false
        description: Filter applications with automatic updates enabled.
        name: inhibit_auto_updates
        in: query
        schema:
          type: boolean
      - example: false
        description: Filter published applications.
        name: published
        in: query
        schema:
          type: boolean
      - example: gms,ssh
        description: Filter applications by their attached addon names.
        name: addons
        in: query
        schema:
          type: string
      - example: x86_64
        description: Filter applications by their supported ABI architecture.
        name: abi
        in: query
        schema:
          type: string
      - example: created_by=anbox,foo,bar
        description: Filter applications by tags.
        name: tags
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success response of the service
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/CollectionResponse'
                properties:
                  metadata:
                    description: List of endpoints
                    type: array
                    items:
                      type: string
                    example: "[\n  \"/1.0/applications/foo\",\n  \"/1.0/applications/bar\"\n]"
        default:
          $ref: '#/components/responses/InternalServerError'
    post:
      description: 'This endpoint creates a new application in AMS using a manifest file. The

        payload to upload must be a tarball compressed with bzip2 or a zip archive.

        Also it must contain a **manifest.yaml** file which declares the basic

        information for the creation of the application.


        Required Extensions:

        `zip_archive_support`: To use the zip format, the server must have the extension.

        To support the following syntax in the application **manifest.yaml** file, the

        server requires the corresponding extensions:

        Manifest Key | Required Extension |

        ---------------- | -----------------------------------|

        resources | application_resource_customization |

        watchdog | application_watchdog_settings |

        services | application_services_configuration |

        version | application_manifest_version |

        video-encoder | application_gpu_encoder |'
      tags:
      - Applications
      summary: Create a new application
      operationId: application_post
      parameters:
      - description: Whether the application is based on a virtual machine or a container
        name: vm
        in: query
        schema:
          type: boolean
          default: false
      - description: SHA-256 fingerprint of the payload e.g b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9
        name: X-AMS-Fingerprint
        in: header
        schema:
          type: string
      responses:
        '202':
          description: Success response of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        default:
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: object
              properties:
                upfile:
                  type: string
                  description: A tarball or zip file
                  format: binary
              required:
              - upfile
    delete:
      description: 'This endpoint deletes multiple applications. If the deletion of a single application

        fails the operation is aborted and an error is returned.'
      tags:
      - Applications
      summary: Delete multiple applications
      operationId: applications_delete
      responses:
        '202':
          description: Success response of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationsDelete'
        description: List of applications to delete
  /1.0/applications/{id}:
    get:
      description: This endpoint gets the information about an application stored in AMS.
      tags:
      - Applications
      summary: Get information about an application
      operationId: application_get
      parameters:
      - description: Id of the application
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success response of the service
          headers:
            Etag:
              description: E-Tag of the resource
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/NoMetaSyncResponse'
                properties:
                  metadata:
                    $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        default:
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: This endpoint deletes an application and its versions from AMS.
      tags:
      - Applications
      summary: Delete an application
      operationId: application_delete
      parameters:
      - description: Id of the application
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Success response of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        default:
          $ref: '#/components/responses/InternalServerError'
    patch:
      description: 'This endpoint updates an application with a new package of format bzip2 or

        zip by uploading a new package to replace/update the existing package.


        Required Extensions:

        `zip_archive_support`: To use the zip format, the server must have the extension.'
      tags:
      - Applications
      summary: Update an application with a new package
      operationId: application_patch_upload
      parameters:
      - description: Id of the application
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: SHA-256 fingerprint of application e.g b94d27b9934d3e08a52e52d7da7dabfac484efe37a5380ee9088f7ace2efcde9
        name: X-AMS-Fingerprint
        in: header
        schema:
          type: string
      responses:
        '202':
          description: Success response of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        default:
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: object
              properties:
                upfile:
                  type: string
                  description: A tarball or zip file
                  format: binary
              required:
              - upfile
  /1.0/applications/{id}/:
    patch:
      description: 'This endpoint updates an applications''s metadata only but not the package.

        Changing the following fields will lead to the creation of a new application

        version:


        SUPPORTED UPDATE FIELD | WILL CREATE A NEW APPLICATION VERSION |

        ------------------------- | ----------------------------------------- |

        image | no |

        instance-type | no |

        tags | no |

        addons | no |

        resources | no |

        inhibit_auto_updates | no |

        services | yes |

        watchdog | yes |

        boot_activity | yes |

        required_permissions | yes |

        video_encoder | yes |

        manifest_version | yes |


        Required Extensions:

        `application_partial_updates`: To use those fields that would create a new

        application version on application update.'
      tags:
      - Applications
      summary: Update an applications's metadata
      operationId: application_patch_meta
      parameters:
      - description: Id of the application to update
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Success response of the service
          headers:
            Etag:
              description: E-Tag of the resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        default:
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPatch'
        description: Details of the attributes to update
  /1.0/applications/{id}/manifest:
    get:
      description: 'This endpoint gets the latest application manifest file.


        Required Extensions:

        `application_manifest_download`: The use of this API requires this extension'
      tags:
      - Applications
      summary: Get an application's manifest
      operationId: application_manifest_get
      parameters:
      - description: Id of the application to retrieve
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success response of the service
          headers:
            X-AMS-ManifestSha256:
              description: SHA-256 of the manifest file
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        default:
          $ref: '#/components/responses/InternalServerError'
  /1.0/applications/{id}/{version}:
    get:
      description: This endpoint gets the information of a specific version of an application.
      tags:
      - Applications
      summary: Get information about an application's specific version
      operationId: application_version_get
      parameters:
      - description: Id of the application
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Version of the application
        name: version
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success response of the service
          headers:
            X-AMS-ManifestSha256:
              description: SHA-256 of the version manifest file
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        default:
          $ref: '#/components/responses/InternalServerError'
    delete:
      description: This endpoint deletes a specific version of an application.
      tags:
      - Applications
      summary: Delete a version of an application
      operationId: application_version_delete
      parameters:
      - description: Id of the application
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Version of the application
        name: version
        in: path
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: Success response of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        default:
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVersionDelete'
        description: Details for the application version to delete
    patch:
      description: 'This endpoint updates the information of a specific version of an application.


        Required Extensions:

        `application_image_export`: The use of this API requires this extension'
      tags:
      - Applications
      summary: Update a specific version of an application
      operationId: application_version_patch
      parameters:
      - description: Id of the application
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Version of the application
        name: version
        in: path
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: Success response of the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        default:
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationVersionPatch'
        description: Details for the application version to update
  /1.0/applications/{id}/{version}/manifest:
    get:
      description: 'This endpoint gets the application manifest file of one specific application

        version.


        Required Extensions:

        `application_manifest_download`: The use of this API requires this extension'
      tags:
      - Applications
      summary: Get the manifest for a specific version of an application
      operationId: application_version_manifest_get
      parameters:
      - description: Id of the application to retrieve
        name: id
        in: path
        required: true
        schema:
          type: string
      - description: Version of the application to retrieve
        name: version
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success response of the service
          headers:
            X-AMS-ManifestSha256:
              description: SHA-256 of the manifest file
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ErrorBadRequest'
        '403':
          $ref: '#/components/responses/ErrorForbidden'
        '404':
          $ref: '#/components/responses/ErrorNotFound'
        default:
          $ref: '#/components/responses/InternalServerError'
  /1.0/applications?recursion=1:
    get:
      description: This endpoint returns a list of available applications in the cluster.
      tags:
      - Applications
      summary: Get a list of applications with expanded object definitions
      operationId: applications_get_recursion1
      parameters:
      - description: Index to start listing the records
        name: offset
        in: query
        schema:
          type: integer
          default: 0
      - description: Limit the number of returned records
        name: limit
        in: query
        schema:
          type: integer
          default: -1
      - description: Expand the returned resource definition
        name: recursion
        in: query
        schema:
          type: integer
          enum:
          - 0
          - 1
          default: 0
      - example: btavtegj1qm58qg7ru50
        description: Filter applications by id. This is an exact match for the string.
        name: id
        in: query
        schema:
          type: string
      - example: my-app
        description: Filter applications by name. This is an exact match for the string.
        name: name
        in: query
        schema:
          type: string
      - example: a2.3
        description: Filter applications by their instance_type.
        name: instance_type
        in: query
        schema:
          type: string
      - example: initializing
        description: Filter applications by status.
        name: status
        in: query
        schema:
          type: string
          enum:
          - initializing
          - ready
          - error
          - deleted
      - example: com.foo.bar
        description: Filter applications by their boot package.
        name: boot_package
        in: query
        schema:
          type: string
      - example: false
        description: Filter immutable applications.
        name: immutable
        in: query
        schema:
          type: boolean
      - example: false
        description: Filter applications with automatic updates enabled.
        name: inhibit_auto_updates
        in: query
        schema:
          type: boolean
      - example: false
        description: Filter published applications.
        name: published
        in: query
        schema:
          type: boolean
      - example: gms,ssh
        description: Filter applications by their attached addon names.
        name: addons
        in: query
        schema:
          type: string
      - example: x86_64
        description: Filter applications by their supported ABI architecture.
        name: abi
        in: query
        schema:
          type: string
      - example: created_by=anbox,foo,bar
        description: Filter applications by tags.
        name: tags
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Success response of the service
          content:
            application/json:
              schema:
                type: object
                allOf:
                - $ref: '#/components/schemas/CollectionResponse'
                properties:
                  metadata:
                    description: List of endpoints
                    type: array
                    items:
                      $ref: '#/components/schemas/Application'
        default:
          $ref: '#/components/responses/InternalServerError'
  /api/v1/applications/foxglove/dashboards/:
    get:
      operationId: applications_foxglove_dashboards_list
      description: List all Foxglove dashboards and their attribute
      summary: List Foxglove dashboards
      tags:
      - Applications
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoxgloveDashboard'
          description: ''
    post:
      operationId: applications_foxglove_dashboards_create
      description: Add a Foxglove dashboard by its ID
      summary: Add a Foxglove dashboard
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoxgloveDashboard'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FoxgloveDashboard'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoxgloveDashboard'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: string
              examples:
                DateParseError:
                  value:
                    field_name: error details
                  summary: Date parse error
          description: ''
  /api/v1/applications/foxglove/dashboards/{uid}/:
    get:
      operationId: applications_foxglove_dashboards_retrieve
      description: Returns Foxglove dashboard JSON object, intended for file download.
      summary: Download Foxglove dashboard JSON file
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - Applications
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: 'Dashboard JSON returned as an attachment with content-disposition header like: ''attachment; filename=dashboard_uid.json'''
        '404':
          description: Dashboard not found
    put:
      operationId: applications_foxglove_dashboards_update
      description: Update all the fields of a given Foxglove dashboard
      summary: Update a Foxglove dashboard completely
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoxgloveDashboard'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FoxgloveDashboard'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoxgloveDashboard'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: string
              examples:
                DateParseError:
                  value:
                    field_name: error details
                  summary: Date parse error
          description: ''
        '404':
          description: Dashboard not found
    patch:
      operationId: applications_foxglove_dashboards_partial_update
      description: Update the provided fields of a given Foxglove dashboard
      summary: Update a Foxglove dashboard partially
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFoxgloveDashboard'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFoxgloveDashboard'
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoxgloveDashboard'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: string
              examples:
                DateParseError:
                  value:
                    field_name: error details
                  summary: Date parse error
          description: ''
        '404':
          description: Dashboard not found
    delete:
      operationId: applications_foxglove_dashboards_destroy
      summary: Delete a Foxglove dashboard
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - Applications
      security:
      - {}
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoxgloveDashboard'
          description: ''
        '404':
          description: Dashboard not found
  /api/v1/applications/grafana/dashboards/:
    get:
      operationId: applications_grafana_dashboards_list
      description: List all Grafana dashboards and their attribute
      summary: List Grafana dashboards
      tags:
      - Applications
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrafanaDashboard'
          description: ''
    post:
      operationId: applications_grafana_dashboards_create
      description: Add a Grafana dashboard by its ID
      summary: Add a Grafana dashboard
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrafanaDashboard'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GrafanaDashboard'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrafanaDashboard'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: string
              examples:
                DateParseError:
                  value:
                    field_name: error details
                  summary: Date parse error
          description: ''
  /api/v1/applications/grafana/dashboards/{uid}/:
    get:
      operationId: applications_grafana_dashboards_retrieve
      description: Returns Grafana dashboard JSON object, intended for file download.
      summary: Download Grafana dashboard JSON file
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - Applications
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: 'Dashboard JSON returned as an attachment with content-disposition header like: ''attachment; filename=dashboard_uid.json'''
        '404':
          description: Dashboard not found
    put:
      operationId: applications_grafana_dashboards_update
      description: Update all the fields of a given Grafana dashboard
      summary: Update a Grafana dashboard completely
      parameters:
      - in: path
        name: uid
        schema:
          type: string
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrafanaDashboard'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GrafanaDashboard'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
