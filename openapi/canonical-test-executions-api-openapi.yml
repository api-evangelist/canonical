openapi: 3.2.0
info:
  title: Test Observer Test Executions API
  description: Test Observer API (see https://github.com/canonical/test_observer)
  license:
    name: GNU Affero General Public License v3
    url: https://raw.githubusercontent.com/canonical/test_observer/refs/heads/main/backend/LICENSE
  version: 0.1.0
tags:
- name: Test Executions
paths:
  /v1/test-executions/end-test:
    put:
      tags:
      - Test Executions
      summary: End Test Execution
      operationId: end_test_execution_v1_test_executions_end_test_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndTestExecutionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - change_test
  /v1/test-executions/{id}/test-results:
    get:
      tags:
      - Test Executions
      summary: Get Test Results
      operationId: get_test_results_v1_test_executions__id__test_results_get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestResultResponse'
                title: Response Get Test Results V1 Test Executions  Id  Test Results Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - view_test
    post:
      tags:
      - Test Executions
      summary: Post Results
      operationId: post_results_v1_test_executions__id__test_results_post
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TestResultRequest'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - change_test
  /v1/test-executions/{id}/links:
    post:
      tags:
      - Test Executions
      summary: Post Link
      operationId: post_link_v1_test_executions__id__links_post
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestExecutionRelevantLinkCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestExecutionRelevantLinkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - change_test
  /v1/test-executions/{id}/links/{link_id}:
    delete:
      tags:
      - Test Executions
      summary: Delete Link
      operationId: delete_link_v1_test_executions__id__links__link_id__delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      - name: link_id
        in: path
        required: true
        schema:
          type: integer
          title: Link Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - change_test
  /v1/test-executions/reruns:
    post:
      tags:
      - Test Executions
      summary: Create Rerun Requests
      operationId: create_rerun_requests_v1_test_executions_reruns_post
      parameters:
      - name: silent
        in: query
        required: false
        schema:
          type: boolean
          description: If true, omit returning created reruns in the response body. Speeds up bulk operations, as the rerun schema contains a lot of information and returning many reruns can be slow. Required when creating reruns with test_results_filters or test_executions_filters.
          default: false
          title: Silent
        description: If true, omit returning created reruns in the response body. Speeds up bulk operations, as the rerun schema contains a lot of information and returning many reruns can be slow. Required when creating reruns with test_results_filters or test_executions_filters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerunRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/PendingRerun'
                - type: 'null'
                title: Response Create Rerun Requests V1 Test Executions Reruns Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - change_rerun
      - change_rerun_bulk
    get:
      tags:
      - Test Executions
      summary: Get Rerun Requests
      operationId: get_rerun_requests_v1_test_executions_reruns_get
      parameters:
      - name: family
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/FamilyName'
          - type: 'null'
          title: Family
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: environment
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment
      - name: environment_architecture
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Environment Architecture
      - name: build_architecture
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Build Architecture
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingRerun'
                title: Response Get Rerun Requests V1 Test Executions Reruns Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - view_rerun
    delete:
      tags:
      - Test Executions
      summary: Delete Rerun Requests
      operationId: delete_rerun_requests_v1_test_executions_reruns_delete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteReruns'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - change_rerun
      - change_rerun_bulk
  /v1/test-executions/reruns/details:
    get:
      tags:
      - Test Executions
      summary: Get Rerun Details
      operationId: get_rerun_details_v1_test_executions_reruns_details_get
      parameters:
      - name: family
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/FamilyName'
      - name: priority
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 1000000
            minimum: -1000000
          - type: 'null'
          title: Priority
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerunDetailsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - view_rerun
  /v1/test-executions/{id}:
    get:
      tags:
      - Test Executions
      summary: Get Test Execution
      operationId: get_test_execution_v1_test_executions__id__get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestExecutionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - view_test
    patch:
      tags:
      - Test Executions
      summary: Patch Test Execution
      operationId: patch_test_execution_v1_test_executions__id__patch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestExecutionsPatchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestExecutionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - change_test
  /v1/test-executions:
    get:
      tags:
      - Test Executions
      summary: Search Test Executions
      description: 'Search test executions with optional test result context.


        Returns one item per matching test execution with paginated results.

        The test_results field contains all filtered test results for that execution.


        Use test_result=none to find executions without results,

        test_result=any to find executions with results,

        or test_result={id} to filter by specific test result IDs.'
      operationId: search_test_executions_v1_test_executions_get
      parameters:
      - name: families
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/FamilyName'
          - type: 'null'
          description: Filter by artefact families (e.g., charm,snap)
          title: Families
        description: Filter by artefact families (e.g., charm,snap)
      - name: artefacts
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by artefact names
          title: Artefacts
        description: Filter by artefact names
      - name: artefact_versions
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by artefact versions
          title: Artefact Versions
        description: Filter by artefact versions
      - name: artefact_stages
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by artefact stages
          title: Artefact Stages
        description: Filter by artefact stages
      - name: artefact_tracks
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by artefact tracks
          title: Artefact Tracks
        description: Filter by artefact tracks
      - name: artefact_is_archived
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by whether the artefact is archived
          title: Artefact Is Archived
        description: Filter by whether the artefact is archived
      - name: environments
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by environment names
          title: Environments
        description: Filter by environment names
      - name: test_plans
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by test plan names
          title: Test Plans
        description: Filter by test plan names
      - name: test_execution_statuses
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/TestExecutionStatus'
          - type: 'null'
          description: Filter by test execution statuses
          title: Test Execution Statuses
        description: Filter by test execution statuses
      - name: reviewer_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: array
            items:
              const: any
              type: string
          - type: array
            items:
              const: none
              type: string
          - type: 'null'
          description: Filter by reviewer user ids
          title: Reviewer Ids
        description: Filter by reviewer user ids
      - name: assignee_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: array
            items:
              const: any
              type: string
          - type: array
            items:
              const: none
              type: string
          - type: 'null'
          description: 'DEPRECATED: Use reviewer_ids instead'
          deprecated: true
          title: Assignee Ids
        description: 'DEPRECATED: Use reviewer_ids instead'
        deprecated: true
      - name: rerun_is_requested
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by whether a rerun has been requested for the test execution
          title: Rerun Is Requested
        description: Filter by whether a rerun has been requested for the test execution
      - name: execution_is_latest
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: Filter by whether the test execution is the latest in its environment/artefact/test plan combination
          title: Execution Is Latest
        description: Filter by whether the test execution is the latest in its environment/artefact/test plan combination
      - name: test_result
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: array
            items:
              const: any
              type: string
          - type: array
            items:
              const: none
              type: string
          - type: 'null'
          description: 'Filter by test result presence: ''any'' (executions with results), ''none'' (executions without results), or specific test result ID(s)'
          title: Test Result
        description: 'Filter by test result presence: ''any'' (executions with results), ''none'' (executions without results), or specific test result ID(s)'
      - name: event_names
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: array
            items:
              const: any
              type: string
          - type: array
            items:
              const: none
              type: string
          - type: 'null'
          description: 'Filter by event log: ''any'' (executions with any events), ''none'' (executions without events), or specific event name(s)'
          title: Event Names
        description: 'Filter by event log: ''any'' (executions with any events), ''none'' (executions without events), or specific event name(s)'
      - name: from_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter executions updated on or after this datetime
          title: From Date
        description: Filter executions updated on or after this datetime
      - name: until_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Filter executions updated on or before this datetime
          title: Until Date
        description: Filter executions updated on or before this datetime
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 0
          description: Maximum number of results to return
          default: 50
          title: Limit
        description: Maximum number of results to return
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of results to skip for pagination
          default: 0
          title: Offset
        description: Number of results to skip for pagination
      - name: execution_metadata
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Filter by execution metadata (base64 encoded category:value pairs).
          title: Execution Metadata
        description: Filter by execution metadata (base64 encoded category:value pairs).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestExecutionSearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - view_test
  /v1/test-executions/start-test:
    put:
      tags:
      - Test Executions
      summary: Start Test Execution
      operationId: start_test_execution_v1_test_executions_start_test_put
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/StartSnapTestExecutionRequest'
              - $ref: '#/components/schemas/StartDebTestExecutionRequest'
              - $ref: '#/components/schemas/StartCharmTestExecutionRequest'
              - $ref: '#/components/schemas/StartImageTestExecutionRequest'
              - $ref: '#/components/schemas/StartSolutionTestExecutionRequest'
              title: Request
              discriminator:
                propertyName: family
                mapping:
                  snap: '#/components/schemas/StartSnapTestExecutionRequest'
                  deb: '#/components/schemas/StartDebTestExecutionRequest'
                  charm: '#/components/schemas/StartCharmTestExecutionRequest'
                  image: '#/components/schemas/StartImageTestExecutionRequest'
                  solution: '#/components/schemas/StartSolutionTestExecutionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - change_test
  /v1/test-executions/{id}/status_update:
    put:
      tags:
      - Test Executions
      summary: Put Status Update
      operationId: put_status_update_v1_test_executions__id__status_update_put
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - change_test
    get:
      tags:
      - Test Executions
      summary: Get Status Update
      operationId: get_status_update_v1_test_executions__id__status_update_get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TestEventResponse'
                title: Response Get Status Update V1 Test Executions  Id  Status Update Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - view_test
    post:
      tags:
      - Test Executions
      summary: Post Status Update
      operationId: post_status_update_v1_test_executions__id__status_update_post
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-permissions:
      - change_test
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    StartSnapTestExecutionRequest:
      properties:
        name:
          type: string
          title: Name
          description: 'User-defined name identifying the artefact under test. Not unique - multiple versions/stages of the same artefact share this name. Examples: ''core22'', ''ubuntu-desktop'', ''snapd'''
        version:
          type: string
          title: Version
          description: Version identifier of the artefact being tested. Format depends on artefact family - e.g., revisions for charms/snaps, version numbers for debs.
        arch:
          type: string
          title: Arch
          description: 'CPU architecture where tests will execute. Common values: ''amd64'', ''arm64'', ''armhf'', ''s390x'', ''ppc64el'''
        environment:
          type: string
          title: Environment
          description: 'Name of the test execution environment. This can identify the specific physical device, VM, or container where tests run or logical environment like a test lab or cloud region. Examples: ''cm3'', ''rpi4'', ''lxd-vm'', ''aws-ec2''. The environment will be auto-created if it doesn''t exist.'
        ci_link:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Ci Link
          description: Optional URL linking to the CI job executing these tests. Useful for tracking test runs back to their automation source. Can be omitted.
        test_plan:
          type: string
          maxLength: 200
          title: Test Plan
          description: Identifier for the test suite or plan executed. Groups related test results together - e.g., 'certification-24.04', 'smoke-tests', 'full-regression'. The test plan will be auto-created if it doesn't exist.
        initial_status:
          $ref: '#/components/schemas/TestExecutionStatus'
          description: Initial status of the test execution. Default 'IN_PROGRESS' is appropriate for ongoing tests. Use 'COMPLETED' if test results will be uploaded separately.
          default: IN_PROGRESS
        relevant_links:
          items:
            $ref: '#/components/schemas/TestExecutionRelevantLinkCreate'
          type: array
          title: Relevant Links
          description: Optional list of additional URLs related to this test execution (e.g., bug reports, documentation, related PRs). Can be omitted or left empty.
        needs_assignment:
          type: boolean
          title: Needs Assignment
          description: Whether the artefact created from this test execution requires assignment of a reviewer. Set to true if test results need human review before the artefact can be promoted. Default false means no review assignment needed.
          default: false
        family:
          type: string
          const: snap
          title: Family
        revision:
          type: integer
          title: Revision
          description: Snap package revision number from the store. Each architecture build has its own revision number. Find this in the snap store or via 'snap info <snap-name>' command.
        track:
          type: string
          title: Track
          description: 'Snap release track being tested. Tracks represent different major versions or streams of development. Common values: ''latest'' (default), version numbers like ''22'', ''1.0'', or custom tracks like ''experimental''. Use ''latest'' if unsure.'
        store:
          type: string
          title: Store
          description: Snap store where the snap is published. Typically 'ubuntu' for public Ubuntu Store snaps, or a brand store ID for enterprise stores. Use 'ubuntu' for standard snaps.
        branch:
          type: string
          maxLength: 200
          title: Branch
          description: Optional snap branch name within the track/risk level. Branches are temporary testing channels. Usually empty string (default) unless testing a specific branch.
          default: ''
        execution_stage:
          $ref: '#/components/schemas/SnapStage'
          description: 'Distribution channel/risk level of the snap being tested. Options: ''edge'' (cutting-edge, frequent updates), ''beta'' (pre-release testing), ''candidate'' (release candidate), ''stable'' (production ready). Choose based on where the snap currently resides in the release pipeline.'
      type: object
      required:
      - name
      - version
      - arch
      - environment
      - test_plan
      - family
      - revision
      - track
      - store
      - execution_stage
      title: StartSnapTestExecutionRequest
    TestResultSearchFilters:
      properties:
        families:
