        credentials:
          type: object
        metadata_admin:
          type: object
        metadata_public:
          type: object
        schema_id:
          type: string
        state:
          type: string
        traits:
          type: object
      type: object
    identitiesRemoveIdentityResp:
      properties:
        data:
          items:
            $ref: '#/components/schemas/identitiesIdentity'
          type: array
        message:
          type: string
        status:
          format: int32
          type: integer
      type: object
    identitiesIdentity:
      properties:
        additional_properties:
          additionalProperties: {}
          type: object
        created_at:
          format: date-time
          type: string
        credentials:
          additionalProperties:
