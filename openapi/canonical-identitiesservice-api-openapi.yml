        schema_id:
          type: string
        schema_url:
          type: string
        state:
          type: string
        state_changed_at:
          format: date-time
          type: string
        traits:
          type: object
        updated_at:
          format: date-time
          type: string
        verifiable_addresses:
          items:
            $ref: '#/components/schemas/identitiesVerifiableIdentityAddress'
          type: array
      type: object
    identitiesCreateIdentityBody:
      properties:
        additional_properties:
          type: object
        credentials:
          type: object
        metadata_admin:
          type: object
        metadata_public:
          type: object
        recovery_addresses:
          items:
            $ref: '#/components/schemas/identitiesRecoveryIdentityAddress'
          type: array
        schema_id:
          type: string
        state:
          type: string
        traits:
          type: object
        verifiable_addresses:
          items:
            $ref: '#/components/schemas/identitiesVerifiableIdentityAddress'
          type: array
      type: object
    identitiesListIdentitiesResp:
      properties:
        data:
          items:
            $ref: '#/components/schemas/identitiesIdentity'
          type: array
        message:
          type: string
        meta:
          $ref: '#/components/schemas/typesPagination'
        status:
          format: int32
          type: integer
      type: object
    identitiesCreateIdentityResp:
      properties:
        data:
          items:
            $ref: '#/components/schemas/identitiesIdentity'
          type: array
        message:
          type: string
        meta:
          $ref: '#/components/schemas/typesPagination'
        status:
          format: int32
          type: integer
      type: object
    identitiesGetIdentityResp:
      properties:
        data:
          items:
            $ref: '#/components/schemas/identitiesIdentity'
          type: array
        message:
          type: string
        meta:
          $ref: '#/components/schemas/typesPagination'
        status:
          format: int32
