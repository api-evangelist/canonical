        created_at:
          format: date-time
          type: string
        id:
          type: string
        status:
          type: string
        updated_at:
          format: date-time
          type: string
        value:
          type: string
        verified:
          type: boolean
        verified_at:
          format: date-time
          type: string
        via:
          type: string
      type: object
    typesPagination:
      properties:
        next:
          type: string
        pageToken:
          type: string
        prev:
          type: string
        size:
          format: int32
          type: integer
      type: object
    identitiesRecoveryIdentityAddress:
      properties:
        additional_properties:
          additionalProperties: {}
          type: object
        created_at:
          format: date-time
          type: string
        id:
          type: string
        updated_at:
          format: date-time
          type: string
        value:
          type: string
        via:
          type: string
      type: object
    typesErrorResponse:
      properties:
        message:
          type: string
        status:
          format: int32
          type: integer
      type: object
    identitiesUpdateIdentityResp:
      properties:
        data:
          items:
            $ref: '#/components/schemas/identitiesIdentity'
          type: array
        message:
          type: string
        meta:
          $ref: '#/components/schemas/typesPagination'
        status:
          format: int32
          type: integer
      type: object
    identitiesIdentityCredentials:
      properties:
        additional_properties:
          additionalProperties: {}
          type: object
        config:
          additionalProperties: {}
          type: object
        created_at:
          format: date-time
          type: string
        identifiers:
          items:
            type: string
