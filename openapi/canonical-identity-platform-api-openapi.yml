            responses:
                "302":
                    content:
                        application/json:
                            schema: {}
                    description: |-
                        Redirects the client to the identity provider's authorization endpoint.

                        The response is a 302 Redirect with a Location header.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/typesErrorResponse'
                    description: Internal server error
            tags:
                - AuthenticationService
    /api/v0/auth/callback:
        get:
            operationId: AuthenticationService_Callback
            parameters:
                - in: query
                  name: code
                  schema:
                    type: string
                - in: query
                  name: scope
                  schema:
                    type: string
                - in: query
                  name: state
                  schema:
                    type: string
            responses:
                "302":
                    content:
                        application/json:
                            schema: {}
                    description: |-
                        This endpoint redirects the client to the original location after authentication.

                        The response is a 302 Redirect with a Location header.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/typesErrorResponse'
                    description: Bad request
                default:
                    content:
                        application/json:
                            schema:
